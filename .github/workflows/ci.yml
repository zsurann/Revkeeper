# Ad ogni pull request e ad ogni push su main: test e build.
# Il Worker dei promemoria si pubblica solo su main, e solo se il secret c'è.
name: Verifica
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Flussi veri nel browser, su Chrome e su Safari (WebKit) (decisione del 28/11/2026)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --trace off

  deploy-cron:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Pubblica il cron delle notifiche
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN assente: deploy del cron saltato."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          # Prima il database, poi il codice: una colonna nuova non arriva mai prima della sua migrazione.
          # Il token serve con Workers Scripts:Edit e D1:Edit. Pages si pubblica da sé in parallelo:
          # le migrazioni devono restare additive (colonne e tabelle nuove), così il codice vecchio regge.
          npx wrangler d1 migrations apply revkeeper --remote
          npx wrangler deploy --config cron/wrangler.toml
