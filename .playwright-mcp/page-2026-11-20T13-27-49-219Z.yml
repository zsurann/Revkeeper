        - generic [ref=f29e18]: Per chi non segue la strada ma solo il suo spirito
      - paragraph [ref=f29e20]: La BMW R 1300 GS incarna la pura essenza dello spirito GS. Il suo peso relativamente ridotto, abbinato alla potenza del motore boxer da 145 CV e dalla generosa cilindrata da 1.300 ccm, la rende un riferimento assoluto nel segmento delle grandi enduro da turismo. Lo scopo dello sviluppo era la massima riduzione invece di un costante aumento della grandezza. Il risultato è un handling inimitabile. Malgrado la ridotta complessità, già nella versione di serie ha una quantità di dotazioni senza precedenti. Scopri qui tutti i dati tecnici e il ricco equipaggiamento.
