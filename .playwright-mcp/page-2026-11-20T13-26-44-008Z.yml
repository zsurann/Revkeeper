      - generic [ref=f27e197]:
        - paragraph [ref=f27e200]: Con il Riding Assistant opzionale puoi viaggiare in sicurezza. Questa opzione comprende un sensore radar nel posteriore che monitora lo spazio intorno alla moto. Durante il cambio di corsia, le spie di avvertimento integrate negli specchietti indicano un eventuale rischio di collisione con un altro veicolo.
