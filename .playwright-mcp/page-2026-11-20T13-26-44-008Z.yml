    - generic [ref=f27e324]:
      - heading "Sii insostituibile" [level=3] [ref=f27e327]
      - paragraph [ref=f27e332]: "Il design carico di energia, la carrozzeria straordinaria, il serbatoio in alluminio leggero: tutto si inserisce in modo efficiente e integrato. Il sottotelaio in alluminio fuso è la base di infinite possibilità. I cerchi di serie realizzati per fusione e la catena cinematica in nero Avus, insieme al telaio principale, distinguono la potenza della zona inferiore rispetto all’espressività della zona anteriore della carrozzeria. La parte frontale bassa e compatta offre una visuale eccellente sulla strada. La nuova icona luminosa simmetrica rappresenta un’autentica rottura rispetto al design della tradizione: un volto inconfondibile."
    - generic [ref=f27e333]:
      - heading "Per chi vuole ancora di più" [level=2] [ref=f27e342]
      - paragraph [ref=f27e348]: "Ti aspetti sempre di più? Ottimo atteggiamento. Scopri le nostre possibilità di personalizzazione. Puoi trovare tutto ciò che corrisponde ai tuoi desideri nel ricco equipaggiamento speciale e nella gamma di accessori originali BMW Motorrad. Oppure, puoi scegliere un carattere che sia solo tuo: la GS Trophy per il fuoristrada, la Triple Black con il massimo comfort e qualità versatili, o la Biscaya per una pura esclusività."
    - generic [ref=f27e350]:
      - heading "La Performer" [level=3] [ref=f27e353]
      - generic [ref=f27e355]:
        - paragraph [ref=f27e358]: Vuoi ottenere ancora di più ancora più rapidamente? Nessun problema. Con questa proposta di allestimento avrai ciò che cerchi. Soprattutto, più divertimento alla guida, con il pacchetto Dynamic. Inoltre, puoi beneficiare di un aggiornamento anche in termini di sicurezza e comfort di viaggio. Scopri la nostra proposta o configura la tua variante personalizzata.
        - link "Vai al configuratore" [ref=f27e359] [cursor=pointer]:
          - /url: /it/models/adventure/r1300gs/configurator.html
