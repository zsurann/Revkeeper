          - heading "Il colore dell’adrenalina" [level=3] [ref=f27e312]
          - paragraph [ref=f27e313]: "Intenso, potente, deciso. Nella versione base, con la dinamica flyline GS, le linee decise e l’aspetto atletico, ci concentriamo su una cosa sola: la tua esperienza."
