        - heading "BMW R 1300 GS" [level=2] [ref=f27e84]
        - generic [ref=f27e85]: Versatilità senza pari
      - paragraph [ref=f27e89]: "Nessun compromesso, tutto è su misura per te. Qual è la posizione di seduta che preferisci per raggiungere i tuoi nuovi traguardi? Più alta, più bassa? Monoposto? In due? Viaggi leggero ed essenziale o con tanti bagagli? Vuoi essere comodo sui lunghi tragitti o sportivo in fuoristrada? L’innovativo concetto modulare del telaio aspetta solo di esaudire i tuoi desideri. Chiamami l’enduro da turismo perfetta: potresti avere ragione."
