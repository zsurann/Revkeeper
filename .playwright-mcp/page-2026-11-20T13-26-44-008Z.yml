      - heading "Non ci sono ostacoli" [level=3] [ref=f27e241]
      - paragraph [ref=f27e246]: "Tutto dipende da te. Il tuo compito: sognare in grande. Il mio compito: darti abbastanza trazione per rendere tutto possibile. Il potente motore da 145 CV, unito alla massa a vuoto ridotta del veicolo, ti offre la potenza di cui hai bisogno. Il carattere del motore boxer di ultima generazione si percepisce nettamente a ogni velocità. Sperimenterai prestazioni straordinarie, con un controllo impressionante e una maggiore fluidità ai bassi regimi."
