        - paragraph [ref=f27e70]:
          - text: Insieme cresciamo oltre i nostri limiti. Sei pronto a diventare la versione migliore di te? Vai avanti. Affronta ogni pendenza e ogni curva con leggerezza. Anche in fuoristrada, nessuno può insegnarti nulla. Cosa ti spinge? Il tuo coraggio, la tua fiducia in te stesso e il mio motore più potente. Insieme dettiamo nuovi standard e viviamo lo
