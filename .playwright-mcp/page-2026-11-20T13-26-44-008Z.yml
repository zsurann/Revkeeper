    - generic [ref=f27e134]:
      - heading "Controllo e maneggevolezza" [level=3] [ref=f27e137]
      - generic [ref=f27e141]:
        - paragraph [ref=f27e142]: "Una leggerezza inattesa: hai tutto sotto controllo. Sotto di te hai 237 chilogrammi*. In un attimo, raggiungere grandi traguardi diventa facilissimo. Su tutti i fondi stradali hai una sensazione di guida senza precedenti. Sulla strada sei stabile e preciso. Piegare, frenare, accelerare... Hai il pieno controllo. Sperimenta una nuova facilità di guida grazie a telai completamente riprogettati, come il nuovo telaietto reggisella monoscocca, i nuovi EVO Telelever ed EVO Paralever, il nuovo DSA (Dynamic Suspension Adjustment) e l'innovativa regolazione adattiva dell'altezza del veicolo."
        - paragraph [ref=f27e143]:
          - subscript [ref=f27e144]: "*con peso a vuoto DIN"
    - generic [ref=f27e145]:
      - heading "Punti di forza per gli high performer" [level=2] [ref=f27e154]
      - paragraph [ref=f27e160]: "Davanti a te: la tua prossima destinazione, ben illuminata con l’iconico faro in LED Matrix. Dietro di te: i traguardi che hai già raggiunto. E il posteriore monoscocca corto con un grande potenziale di personalizzazione. Non c'è dubbio: Stai guidando il modello di punta delle grandi moto Adventure. Scopri l'ampio equipaggiamento di serie:"
    - generic [ref=f27e164]:
      - heading "Raggiungi il prossimo livello" [level=3] [ref=f27e165]
      - paragraph [ref=f27e169]: "Tutto è costruito intorno alle tue esigenze: comfort di marcia al livello superiore. L’innovativo supporto Telelever offre un handling eccezionale. La flyline GS, con una linea sella-serbatoio extra piatta, offre una libertà di movimento senza precedenti, una facile manovra e una posizione di seduta rilassata. L'ampia variabilità ergonomica consente ai piloti con le esigenze più diverse di gestire qualsiasi terreno. Grazie ai sensori ambientali del Riding Assistant opzionale, hai sempre tutto sotto controllo."
    - generic [ref=f27e173]:
      - heading "Concentrata sull'essenza dello spirito GS" [level=3] [ref=f27e174]
      - paragraph [ref=f27e178]: "Direzione: nuove avventure. Grazie al Keyless Ride, ti basta salire in sella e puoi subito partire. Devi solo prendere posto sulla comoda sella di serie, che ha un’altezza variabile da 800 a 890 mm. Aziona l’indicatore di direzione integrato nel paramani e svolta verso la libertà. Ad ogni metro sarà sempre più chiaro: ti trovi in sella a qualcosa di unico. È molto semplice, la vera grandezza non richiede esagerazioni. Qui non ci sono elementi superflui, tutto si concentra sull'essenza della guida GS: il puro piacere di guidare."
    - generic [ref=f27e182]:
      - heading "Il cambio che regala libertà" [level=3] [ref=f27e183]
      - button "Apri" [ref=f27e188] [cursor=pointer]:
        - generic [ref=f27e189]: Cambio elettro-assistito automatico (ASA)
    - generic [ref=f27e195]:
