      - generic [ref=f23e611]:
        - paragraph [ref=f23e612]: I veicoli rappresentati nelle immagini possono differire per alcuni particolari dai modelli di produzione e montare optional disponibili solo a pagamento. Tutte le informazioni relative a volume della fornitura, aspetto, servizi, pesi e dimensioni non sono vincolanti e sono specificate con riserva di errori tipografici, di composizione e di stampa. Nel caso di superfici rivestite, potranno essere presenti differenze di colore dovute alle normali deviazioni del processo. Con riserva di modifica senza preavviso. I consumi indicati si riferiscono ai veicoli di serie omologati per uso su strada al momento della consegna. Le immagini e le illustrazioni dei modelli Enduro mostrano la versione della moto da competizione e non quella omologata.
        - paragraph [ref=f23e613]: Lo sconto indicato è disponibile esclusivamente presso i concessionari KTM autorizzati e aderenti. Tutte le informazioni sono senza impegno. Errori di stampa, composizione, battitura e altri errori sono riservati. Le informazioni possono essere modificate in qualsiasi momento senza preavviso.
