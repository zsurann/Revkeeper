                            - link "TFT-DISPLAY" [ref=f23e154] [cursor=pointer]:
                              - /url: https://www.ktm.com/tech-guide/tft
                        - paragraph [ref=f23e155]: Tutto ciò che serve a colpo d’occhio. La KTM 390 DUKE ha un nuovissimo quadro strumenti TFT in vetro incollato da 5”. Tutto ciò è abbinato a nuovo blocchetto con interruttori a menu a 4 vie che consentono una facile interazione con tutte le funzionalità del veicolo, persino con la connettività dello smartphone. A questo proposito, tutti i modelli DUKE New Generation sono dotati di funzioni di connettività che permettono al pilota di ascoltare musica, rispondere alle chiamata in entrata e raggiungere la propria destinazione con il sistema di navigazione Turn by Turn.
                    - article [ref=f23e156]:
                      - figure [ref=f23e158]:
                        - img "NAKED AGGRESSION" [ref=f23e159]
                      - generic [ref=f23e161]:
                        - generic [ref=f23e162]: NAKED AGGRESSION
                        - heading "Sovrastrutture" [level=3] [ref=f23e163]
                        - paragraph [ref=f23e164]: Fedele alla filosofia delle moto NAKED, la KTM 390 DUKE non ha certo paura di incarnarla appieno. Con una presenza sempre più minacciosa, spigoli simili a quelli di uno squalo e prese d’aria visibili, la KTM 390 DUKE ha un aspetto davvero aggressivo. Il nuovo serbatoio in metallo, grafiche della carena con tecnologia in-mold e luci di posizione esterne a LED completano il pacchetto.
