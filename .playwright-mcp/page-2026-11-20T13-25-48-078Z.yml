                  - heading [level=3] [ref=f23e453]:
                    - link "Garanzia Premium del Produttore" [ref=f23e454] [cursor=pointer]:
                      - /url: https://www.ktm.com/service/warranty
                  - paragraph [ref=f23e455]: Questa motocicletta è dotata di una GARANZIA PREMIUM DEL PRODUTTORE. I piloti possono beneficiare di una copertura fino a 4 anni; guida senza pensieri e vivi l'emozione KTM con maggiore tranquillità. Per mantenere valida la garanzia, gli interventi di manutenzione periodica devono essere effettuati secondo il piano di assistenza presso un concessionario KTM autorizzato. Maggiori informazioni e dettagli su come usufruire di questa offerta sono disponibili sulla pagina di garanzia KTM. Valida a partire dall'anno modello 2025 per tutte le motociclette omologate per uso stradale dell'intera gamma street. Precedentemente limitata a modelli selezionati, la Garanzia Premium del Produttore ora copre l'intera gamma street.
