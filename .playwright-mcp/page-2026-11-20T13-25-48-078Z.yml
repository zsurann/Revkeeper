                        - heading "Grafiche" [level=3] [ref=f23e134]
                        - paragraph [ref=f23e135]: Il look premium diventa di serie sulla KTM 390 DUKE. Una finitura di alta qualità, multistrato e verniciata a umido nei nuovissimi colori Electronic Orange o Atlantic Blue con grafiche trasparenti fa risaltare perfettamente l'esclusiva copertina della sella testurizzata DUKE. Non ci sono dubbi, questa è una DUKE al 100% con uno spirito al 110% street.
