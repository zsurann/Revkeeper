                            - /url: https://www.ktm.com/tech-guide/led-lights
                        - paragraph [ref=f23e211]: Per aprire un varco nella notte, tutti i modelli KTM DUKE sono equipaggiati con potenti luci a LED sia all'anteriore che al posteriore. Non sono ottime solo quando tutto intorno diventa buio, ma offrono anche una migliore visibilità quando si guida nel traffico intenso o in condizioni della strada con nebbia.
                    - article [ref=f23e212]:
                      - figure [ref=f23e214]:
                        - img "POWER HUNGRY" [ref=f23e215]
                      - generic [ref=f23e217]:
                        - generic [ref=f23e218]: POWER HUNGRY
                        - heading [level=3] [ref=f23e219]:
                          - link "Motore" [ref=f23e220] [cursor=pointer]:
                            - /url: https://www.ktm.com/tech-guide/lc8-engine
                        - paragraph [ref=f23e221]: Dotata dell'ultima generazione di motori LC4c, la KTM 390 DUKE si presenta con una cubatura di 399 cm³, un'accelerazione più fluida e un peso complessivo inferiore rispetto al passato. Grazie ad anni di esperienza nel settore dei motori di piccola cilindrata, la KTM 390 DUKE ora dispone anche di una scatola del cambio migliorata e di una testa del cilindro ottimizzata, ed è pronta ad adottare gli standard di emissione EURO 5.2. Abbiamo detto che è anche READY TO RACE?
                    - article [ref=f23e222]:
                      - figure [ref=f23e224]:
                        - img "PICK YOUR POWER" [ref=f23e225]
                      - generic [ref=f23e227]:
                        - generic [ref=f23e228]: PICK YOUR POWER
                        - heading [level=3] [ref=f23e229]:
                          - link "Riding mode" [ref=f23e230] [cursor=pointer]:
                            - /url: https://www.ktm.com/tech-guide/engine-map-selection
                        - paragraph [ref=f23e231]: La KTM 390 DUKE offre ai suoi piloti una selezione di riding mode per adattarsi al meglio a qualsiasi condizione. La modalità STREET, attivata di serie, sprigiona tutta la furia della KTM 390 DUKE, mentre la modalità RAIN consente di mantenere un po’ più controllo sul bagnato. Entrambe sono facilmente attivabili tramite il display TFT.
                    - article [ref=f23e232]:
                      - figure [ref=f23e234]
                      - generic [ref=f23e237]:
                        - heading "Track Screen" [level=3] [ref=f23e238]
                        - paragraph [ref=f23e239]: La schermata TRACK trasforma i grafici del display TFT da 5" in un'interfaccia più orientata alle gare, ingrandendo il contagiri, mostrando il cronometro dei giri, il display del rapporto selezionato, riducendo le dimensioni della velocità visualizzata e mostrando le impostazioni preferite per gli ausili al pilota. Inoltre, la schermata TRACK consente anche ai piloti di attivare il Controllo di Partenza.
                    - article [ref=f23e240]:
                      - figure [ref=f23e242]:
                        - img "ROCKET OFF THE LINE" [ref=f23e243]
                      - generic [ref=f23e245]:
                        - generic [ref=f23e246]: ROCKET OFF THE LINE
                        - heading [level=3] [ref=f23e247]:
                          - link "Launch control" [ref=f23e248] [cursor=pointer]:
                            - /url: https://www.ktm.com/tech-guide/launch-control
                        - paragraph [ref=f23e249]: Preparati a partire a razzo perché, per la prima volta in assoluto, la KTM 390 DUKE è dotata di serie del launch control. Quando il sistema è inserito, il motore raggiunge i 7.000 giri al minuto con l'acceleratore spalancato, in attesa che venga rilasciata la frizione.
