                - generic [ref=f23e350]:
                  - generic [ref=f23e352]:
                    - article [ref=f23e353]:
                      - figure [ref=f23e355]:
                        - img "STOPPING POWER" [ref=f23e356]
                      - generic [ref=f23e358]:
                        - generic [ref=f23e359]: STOPPING POWER
                        - heading "Freni" [level=3] [ref=f23e360]
                        - paragraph [ref=f23e361]: Sulla ruota anteriore, la KTM 390 DUKE vanta un disco del freno da 320 mm con nuovissime pinze radiali a quattro pistoncini. Il nuovo design prevede dischi più grandi per ridurre la temperatura di esercizio, con miglioramenti per eliminare l'effetto fading e maggiore durata delle pastiglie. Sulla ruota posteriore è installato un disco del freno da 240 mm con una nuovissima pinza a due pistoncini che offre gli stessi vantaggi della ruota anteriore. Altre caratteristiche di serie sono l’ABS sensibile all'angolo di piega e l’ABS SUPERMOTO.
                    - article [ref=f23e362]:
                      - figure [ref=f23e364]:
                        - img "THE BACKBONE" [ref=f23e365]
                      - generic [ref=f23e367]:
                        - generic [ref=f23e368]: THE BACKBONE
                        - heading "Telaio" [level=3] [ref=f23e369]
                        - paragraph [ref=f23e370]: Il nuovo design presenta una struttura a due pezzi composta da un nuovissimo telaio principale a traliccio e da un telaietto posteriore in alluminio pressofuso. L’ammortizzatore ora è montato in posizione decentrata per ospitare una cassa del filtro dell'aria più grande, riducendo al contempo l’altezza della sella e aumentando l’aggressività della DUKE. Il telaio non è stato progettato solo per l’estetica, ma ha come obiettivo principale quello di migliorare la dinamica del veicolo aumentando la rigidità torsionale, incrementando l’agilità e il feedback della ciclistica.
                    - article [ref=f23e371]:
                      - figure [ref=f23e373]:
                        - img "CURVED PIVOT" [ref=f23e374]
                      - generic [ref=f23e376]:
                        - generic [ref=f23e377]: CURVED PIVOT
                        - heading "Forcellone" [level=3] [ref=f23e378]
                        - paragraph [ref=f23e379]: Un nuovo forcellone curvo in alluminio pressofuso fornisce una piattaforma robusta e durevole per il sistema di sospensione posteriore, con un attacco diretto all'ammortizzatore che ora è sfalsato lateralmente, per un look super corsaiolo. Questo crea anche uno spazio aggiuntivo per il nuovo silenziatore che contribuisce al carattere della moto.
                    - article [ref=f23e380]:
                      - figure [ref=f23e382]:
                        - img "SPRING INTO ACTION" [ref=f23e383]
                      - generic [ref=f23e385]:
                        - generic [ref=f23e386]: SPRING INTO ACTION
                        - heading "Forcella" [level=3] [ref=f23e387]
                        - paragraph [ref=f23e388]: All'anteriore, una forcella WP APEX Open Cartridge da 43 mm con un'escursione di 150 mm tiene sotto controllo la situazione, con impostazioni regolabili in compressione ed estensione.
                    - article [ref=f23e389]:
                      - figure [ref=f23e391]:
                        - img "MAX TRACTION" [ref=f23e392]
                      - generic [ref=f23e394]:
                        - generic [ref=f23e395]: MAX TRACTION
                        - heading "Ammortizzatore" [level=3] [ref=f23e396]
                        - paragraph [ref=f23e397]: Al posteriore c'è un ammortizzatore WP APEX con pistone separato che offre 150 mm di escursione e 60 mm di corsa. L'estensione è facilmente modificabile con un clicker a 5 posizioni e anche il precarico è regolabile.
                    - article [ref=f23e398]:
                      - figure [ref=f23e400]:
                        - img "ROLLING THUNDER" [ref=f23e401]
                      - generic [ref=f23e403]:
                        - generic [ref=f23e404]: ROLLING THUNDER
                        - heading "Cerchi e pneumatici" [level=3] [ref=f23e405]
                        - paragraph [ref=f23e406]: Tagliando il peso dove conta di più, la gamma KTM DUKE ha fatto notevoli passi avanti nella riduzione della massa non sospesa grazie a un set di ruote leggere e a pneumatici aderenti Michelin. Questo non solo migliora le caratteristiche generali di maneggevolezza, ma si traduce anche in una maggiore rapidità di inserimento in curva e in una minore sollecitazione di componenti come assali e cuscinetti.
                    - article [ref=f23e407]:
                      - figure [ref=f23e409]:
                        - img "STOPPING POWER" [ref=f23e410]
                      - generic [ref=f23e412]:
                        - generic [ref=f23e413]: STOPPING POWER
                        - heading "Freni" [level=3] [ref=f23e414]
                        - paragraph [ref=f23e415]: Sulla ruota anteriore, la KTM 390 DUKE vanta un disco del freno da 320 mm con nuovissime pinze radiali a quattro pistoncini. Il nuovo design prevede dischi più grandi per ridurre la temperatura di esercizio, con miglioramenti per eliminare l'effetto fading e maggiore durata delle pastiglie. Sulla ruota posteriore è installato un disco del freno da 240 mm con una nuovissima pinza a due pistoncini che offre gli stessi vantaggi della ruota anteriore. Altre caratteristiche di serie sono l’ABS sensibile all'angolo di piega e l’ABS SUPERMOTO.
                    - article [ref=f23e416]:
                      - figure [ref=f23e418]:
                        - img "THE BACKBONE" [ref=f23e419]
                      - generic [ref=f23e421]:
                        - generic [ref=f23e422]: THE BACKBONE
                        - heading "Telaio" [level=3] [ref=f23e423]
                        - paragraph [ref=f23e424]: Il nuovo design presenta una struttura a due pezzi composta da un nuovissimo telaio principale a traliccio e da un telaietto posteriore in alluminio pressofuso. L’ammortizzatore ora è montato in posizione decentrata per ospitare una cassa del filtro dell'aria più grande, riducendo al contempo l’altezza della sella e aumentando l’aggressività della DUKE. Il telaio non è stato progettato solo per l’estetica, ma ha come obiettivo principale quello di migliorare la dinamica del veicolo aumentando la rigidità torsionale, incrementando l’agilità e il feedback della ciclistica.
