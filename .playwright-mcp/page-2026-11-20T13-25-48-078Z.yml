                        - heading "Regolabilità" [level=3] [ref=f23e143]
                        - paragraph [ref=f23e144]: Trovare l'assetto perfetto per sfrecciare sulla tua strada preferita o per passare in modo agile da una curva stretta all'altra è un gioco da ragazzi grazie alla forcella WP APEX Open Cartridge da 43 mm della KTM 390 DUKE, regolabile in compressione ed estensione. Al posteriore, l'ammortizzatore WP APEX con pistone separato può essere regolato anche in estensione e precarico, per trovare il mix ideale tra comfort e trazione.
                    - article [ref=f23e145]:
                      - figure [ref=f23e147]:
                        - img "INFOTAINMENT" [ref=f23e148]
                      - generic [ref=f23e150]:
                        - generic [ref=f23e151]: INFOTAINMENT
                        - heading [level=3] [ref=f23e152]:
