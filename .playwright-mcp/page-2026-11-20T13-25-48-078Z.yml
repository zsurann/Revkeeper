                      - generic [ref=f23e296]:
                        - generic [ref=f23e297]: FIND YOUR FOOTING
                        - heading "Pedane" [level=3] [ref=f23e298]
                        - paragraph [ref=f23e299]: I nuovi e leggeri supporti della pedana in alluminio forgiato e le pedane antiscivolo assicurano al pilota di avere sempre la massima aderenza quando inserisce le marce, con pedane di alta gamma fresate CNC disponibili nel catalogo KTM PowerParts.
                    - article [ref=f23e300]:
                      - figure [ref=f23e302]:
                        - img "RACE TO COMFORT" [ref=f23e303]
                      - generic [ref=f23e305]:
                        - generic [ref=f23e306]: RACE TO COMFORT
                        - heading "Ergonomia" [level=3] [ref=f23e307]
                        - paragraph [ref=f23e308]: Grazie a un interasse leggermente più lungo, a nuove altezze della sella e alla geometria del telaio, la gamma DUKE vanta un comportamento in curva, una stabilità e una maneggevolezza nettamente migliorati. Questo, insieme alla già ottima reputazione di essere THE CORNER ROCKET e a una posizione di seduta aggressiva, fa sì che la KTM 390 DUKE definisca lo standard quando si parla di moto NAKED dal carattere decisamente dinamico.
                    - article [ref=f23e309]:
                      - figure [ref=f23e311]:
                        - img "TAKE A SEAT" [ref=f23e312]
                      - generic [ref=f23e314]:
                        - generic [ref=f23e315]: TAKE A SEAT
                        - heading "Sella" [level=3] [ref=f23e316]
                        - paragraph [ref=f23e317]: Maggiore comfort per il pilota e il passeggero grazie all’espanso della sella più spesso, a un profilo più stretto e a un miglioramento generale dell’ergonomia. Preferisci un’altezza della sella maggiore o minore? La KTM 390 DUKE ha un'altezza della sella standard di 820 mm, ma può essere facilmente abbassata a 800 mm con la sella opzionale KTM PowerParts.
