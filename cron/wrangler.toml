name = "revkeeper-cron"
main = "worker.ts"
compatibility_date = "2026-11-01"
# Sentry usa AsyncLocalStorage
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[triggers]
crons = ["*/10 * * * *", "30 2 * * SUN"] # promemoria ogni 10 minuti (spazio una volta all'ora); la domenica copia di database e file e pulizia inattivi

[vars]
# DSN pubblico del progetto Sentry "revkeeper-api"
SENTRY_DSN = "https://3198cfd0a3547a793223b94a02d4f8c0@o4512444032352256.ingest.de.sentry.io/4512490393829456"
VAPID_SUBJECT = "https://revkeeper.pages.dev"
VAPID_PUBLIC_KEY = "BCuIILVL_fqPhBQ3QuT-qiYNLyj0Vn_9lcpRv3PrQ_rCBP5FcP91ezdYRwE3kpWK9o_aOL2cF_mUc7V1hg97PsQ"

[[d1_databases]]
binding = "DB"
database_name = "revkeeper"
database_id = "155ba912-464e-4fd1-b2ea-0d223f8c386f"

# Release di Sentry: l'id della versione pubblicata (l'SDK lo legge da solo da questo binding)
[version_metadata]
binding = "CF_VERSION_METADATA"

# Copie notturne del database (7 giorni)
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "revkeeper-backups"
jurisdiction = "eu"

# File degli utenti: letti dalla copia settimanale e cancellati con gli account inattivi
[[r2_buckets]]
binding = "FILES"
bucket_name = "revkeeper-files"
jurisdiction = "eu"
